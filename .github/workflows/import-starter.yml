name: Import starter project files

on:
  push:
    paths:
      - "starter.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decode and extract starter project
        run: |
          test -s starter.trigger
          cat starter.part.*.b64 | base64 --decode | tar -xJ --strip-components=1
      - name: Generate the shared CSV dataset
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas
          python data/generate_dataset.py
      - name: Remove the one-time bootstrap files
        run: |
          rm starter.trigger starter.part.*.b64
          rm -f .github/workflows/import-starter.yml
          rm -f .github/workflows/tests.yml
      - name: Commit and push project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish KNIME and Python learning guide"
            git push origin HEAD:main
          fi
