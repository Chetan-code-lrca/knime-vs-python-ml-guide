name: Import starter project files

on:
  push:
    paths:
      - "starter.tar.xz.b64"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Decode and extract starter project
        run: |
          test -s starter.tar.xz.b64
          base64 --decode starter.tar.xz.b64 | tar -xJ --strip-components=1
          rm starter.tar.xz.b64
          rm -f .github/workflows/import-starter.yml
      - name: Commit and push project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish KNIME and Python learning guide"
            git push origin HEAD:main
          fi
